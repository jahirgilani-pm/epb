name: Daily Job Scraper

on:
  schedule:
    - cron: "0 2 * * *"  # 7:30 AM IST (UTC+5:30)
  workflow_dispatch:      # allow manual trigger

jobs:
  scrape:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r scraper/requirements.txt

      - name: Install Playwright browsers
        run: playwright install chromium

      - name: Validate credentials
        env:
          GOOGLE_CREDENTIALS: ${{ secrets.GOOGLE_CREDENTIALS }}
        run: |
          python3 -c "
          import json, os, sys
          raw = os.environ['GOOGLE_CREDENTIALS']
          try:
              data = json.loads(raw)
              email = data.get('client_email', 'missing')
              key_id = data.get('private_key_id', 'missing')[:8]
              lines = [l for l in data.get('private_key','').split('\n') if l and not l.startswith('-----')]
              bad = [(i, len(l)) for i, l in enumerate(lines) if len(l) != 64]
              print(f'email: {email}')
              print(f'key_id prefix: {key_id}')
              print(f'key lines: {len(lines)}, bad lines: {bad}')
          except Exception as e:
              print(f'JSON parse error: {e}')
              sys.exit(1)
          "

      - name: Run scraper
        env:
          GOOGLE_CREDENTIALS: ${{ secrets.GOOGLE_CREDENTIALS }}
          SHEET_ID: ${{ secrets.SHEET_ID }}
        run: python scraper/main.py
