<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>EPB Job Tracker - Bengaluru & Hyderabad</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: #f5f6fa;
      color: #1a1a2e;
      min-height: 100vh;
    }

    header {
      background: #1a1a2e;
      color: #fff;
      padding: 24px 20px 20px;
    }
    header h1 { font-size: 1.4rem; font-weight: 700; }
    header p { font-size: 0.85rem; color: #a0a8c0; margin-top: 4px; }

    .filters {
      background: #fff;
      border-bottom: 1px solid #e2e6f0;
      padding: 14px 20px;
      display: flex;
      gap: 12px;
      flex-wrap: wrap;
      align-items: center;
    }
    .filters select {
      border: 1px solid #d0d5e8;
      border-radius: 8px;
      padding: 8px 12px;
      font-size: 0.875rem;
      background: #fff;
      color: #1a1a2e;
      cursor: pointer;
      outline: none;
    }
    .filters select:focus { border-color: #4f6ef7; }

    .filters input[type="text"] {
      border: 1px solid #d0d5e8;
      border-radius: 8px;
      padding: 8px 12px;
      font-size: 0.875rem;
      flex: 1;
      min-width: 180px;
      outline: none;
    }
    .filters input[type="text"]:focus { border-color: #4f6ef7; }

    .meta {
      padding: 12px 20px;
      font-size: 0.8rem;
      color: #6b7280;
    }

    .jobs {
      padding: 0 20px 40px;
      display: grid;
      gap: 14px;
      max-width: 900px;
      margin: 0 auto;
    }

    .card {
      background: #fff;
      border-radius: 12px;
      padding: 18px;
      border: 1px solid #e8ecf5;
      transition: box-shadow 0.15s;
    }
    .card:hover { box-shadow: 0 4px 16px rgba(79,110,247,0.1); }

    .card-top {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      gap: 12px;
    }

    .card-title {
      font-size: 1rem;
      font-weight: 600;
      color: #1a1a2e;
    }
    .card-company {
      font-size: 0.875rem;
      color: #4b5563;
      margin-top: 3px;
    }

    .card-source {
      font-size: 0.7rem;
      font-weight: 600;
      padding: 3px 8px;
      border-radius: 20px;
      white-space: nowrap;
      flex-shrink: 0;
    }
    .source-internshala { background: #fff3cd; color: #856404; }
    .source-naukri { background: #d1ecf1; color: #0c5460; }

    .card-meta {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      margin-top: 10px;
      font-size: 0.8rem;
      color: #6b7280;
    }
    .card-meta span { display: flex; align-items: center; gap: 4px; }

    .card-tags {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
      margin-top: 10px;
    }
    .tag {
      font-size: 0.73rem;
      background: #f0f2ff;
      color: #4f6ef7;
      border-radius: 6px;
      padding: 3px 8px;
    }

    .card-footer {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-top: 14px;
      padding-top: 12px;
      border-top: 1px solid #f0f2f8;
    }
    .posted { font-size: 0.75rem; color: #9ca3af; }
    .apply-btn {
      background: #4f6ef7;
      color: #fff;
      text-decoration: none;
      padding: 7px 16px;
      border-radius: 8px;
      font-size: 0.8rem;
      font-weight: 600;
      transition: background 0.15s;
    }
    .apply-btn:hover { background: #3b57e0; }

    .empty {
      text-align: center;
      color: #9ca3af;
      padding: 60px 20px;
      font-size: 0.95rem;
    }

    .loading {
      text-align: center;
      padding: 60px 20px;
      color: #6b7280;
    }

    @media (max-width: 480px) {
      .filters { gap: 8px; }
      .filters select, .filters input[type="text"] { width: 100%; }
    }
  </style>
</head>
<body>

<header>
  <h1>EPB Job Tracker</h1>
  <p>Fresher & entry-level jobs in Bengaluru</p>
</header>

<div class="filters">
  <input type="text" id="search" placeholder="Search by title or company..." oninput="renderJobs()" />
  <select id="category" onchange="renderJobs()">
    <option value="">All Categories</option>
    <option value="IT / Tech">IT / Tech</option>
    <option value="Sales">Sales</option>
    <option value="Marketing">Marketing</option>
    <option value="Finance">Finance</option>
    <option value="HR">HR</option>
    <option value="Design">Design</option>
    <option value="Customer Service">Customer Service</option>
    <option value="Operations">Operations</option>
    <option value="Other">Other</option>
  </select>
  <select id="source" onchange="renderJobs()">
    <option value="">All Sources</option>
    <option value="Internshala">Internshala</option>
    <option value="Indeed">Indeed</option>
    <option value="Naukri">Naukri</option>
  </select>
</div>

<div class="meta" id="meta"></div>
<div class="jobs" id="jobs"><div class="loading">Loading jobs...</div></div>

<script>
  // Replace with your Google Sheet ID and sheet name
  const SHEET_ID = "1UcXA3xn6Ok4LCYrPHKVlM9gfmkGAEOWmufY0g4GjHXU";
  const SHEET_NAME = "Jobs";

  let allJobs = [];

  async function loadJobs() {
    const url = `https://docs.google.com/spreadsheets/d/${SHEET_ID}/gviz/tq?tqx=out:csv&sheet=${encodeURIComponent(SHEET_NAME)}`;
    try {
      const resp = await fetch(url);
      const csv = await resp.text();
      allJobs = parseCSV(csv);
      renderJobs();
    } catch (e) {
      document.getElementById("jobs").innerHTML = '<div class="empty">Failed to load jobs. Please try again later.</div>';
    }
  }

  function parseCSV(csv) {
    const lines = csv.trim().split("\n");
    if (lines.length < 2) return [];
    const headers = parseCSVLine(lines[0]);
    return lines.slice(1).map(line => {
      const vals = parseCSVLine(line);
      const obj = {};
      headers.forEach((h, i) => obj[h] = (vals[i] || "").trim());
      return obj;
    }).filter(j => j["Job Title"]);
  }

  function parseCSVLine(line) {
    const result = [];
    let current = "";
    let inQuotes = false;
    for (let i = 0; i < line.length; i++) {
      const ch = line[i];
      if (ch === '"') {
        if (inQuotes && line[i + 1] === '"') { current += '"'; i++; }
        else inQuotes = !inQuotes;
      } else if (ch === "," && !inQuotes) {
        result.push(current);
        current = "";
      } else {
        current += ch;
      }
    }
    result.push(current);
    return result;
  }

  function renderJobs() {
    const search = document.getElementById("search").value.toLowerCase();
    const city = document.getElementById("city").value.toLowerCase();
    const category = document.getElementById("category").value;
    const source = document.getElementById("source").value;

    const filtered = allJobs.filter(j => {
      if (search && !j["Job Title"].toLowerCase().includes(search) && !j["Company"].toLowerCase().includes(search)) return false;
      if (city && !j["Location"].toLowerCase().includes(city)) return false;
      if (category && j["Category"] !== category) return false;
      if (source && j["Source"] !== source) return false;
      return true;
    });

    document.getElementById("meta").textContent = `${filtered.length} job${filtered.length !== 1 ? "s" : ""} found`;

    const container = document.getElementById("jobs");
    if (!filtered.length) {
      container.innerHTML = '<div class="empty">No jobs match your filters.</div>';
      return;
    }

    container.innerHTML = filtered.map(j => `
      <div class="card">
        <div class="card-top">
          <div>
            <div class="card-title">${esc(j["Job Title"])}</div>
            <div class="card-company">${esc(j["Company"])}</div>
          </div>
          <span class="card-source source-${(j["Source"] || "").toLowerCase()}">${esc(j["Source"])}</span>
        </div>
        <div class="card-meta">
          ${j["Location"] ? `<span>📍 ${esc(j["Location"])}</span>` : ""}
          ${j["Experience"] ? `<span>💼 ${esc(j["Experience"])}</span>` : ""}
          ${j["Salary"] ? `<span>💰 ${esc(j["Salary"])}</span>` : ""}
        </div>
        ${j["Category"] ? `<div class="card-tags"><span class="tag">${esc(j["Category"])}</span></div>` : ""}
        <div class="card-footer">
          <span class="posted">${esc(j["Posted"] || j["Scraped Date"] || "")}</span>
          <a class="apply-btn" href="${esc(j["Apply URL"])}" target="_blank" rel="noopener noreferrer">Apply →</a>
        </div>
      </div>
    `).join("");
  }

  function esc(str) {
    return (str || "").replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;");
  }

  loadJobs();
</script>
</body>
</html>
